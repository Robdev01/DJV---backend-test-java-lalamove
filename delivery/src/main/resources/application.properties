spring.application.name=delivery

# Logs detalhados da camada web para acompanhar requisicoes e mapeamento de rotas.
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Log customizado do projeto.
logging.level.desafio.fcamara.desafio=DEBUG

# Exibe o SQL gerado pelo Hibernate durante desenvolvimento.
logging.level.org.hibernate.SQL=DEBUG

# Tambem mostra SQL no console para facilitar o estudo da persistencia.
spring.jpa.show-sql=true
